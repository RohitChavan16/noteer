<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rotated Group for Tilt (-6 degrees) -->
  <g transform="rotate(-6, 256, 256)">
    <!-- Drop Shadow (Soft & Offset) -->
    <rect x="70" y="70" width="390" height="390" rx="5" ry="5" fill="rgba(0,0,0,0.15)"/>
    
    <!-- Sticky Note Body (Warm Pastel Yellow) -->
    <rect x="60" y="60" width="390" height="390" rx="5" ry="5" fill="#FFF9C4"/>
    
    <!-- Adhesive Strip (Subtle top highlight) -->
    <rect x="60" y="60" width="390" height="50" rx="5" ry="5" fill="rgba(255,255,255,0.4)"/>
    
    <!-- Handwritten 'N' - Marker Style -->
    <!-- Using thick stroke + rounded caps for marker look -->
    <path 
      d="M 170 360 L 170 150 Q 170 130 190 140 L 330 360 Q 350 380 350 350 L 350 150" 
      fill="none" 
      stroke="#2D2D2D" 
      stroke-width="35" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
</svg>
