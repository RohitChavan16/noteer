[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:postgresql]
command=/usr/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_error.log

[program:noteer]
command=node /app/backend/src/index.js
directory=/app/backend
user=node
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; environment=NODE_ENV="%(ENV_NODE_ENV)s",DATABASE_URL="%(ENV_DATABASE_URL)s",PORT="%(ENV_PORT)s",ADMIN_EMAIL="%(ENV_ADMIN_EMAIL)s",ADMIN_PASSWORD="%(ENV_ADMIN_PASSWORD)s",REGISTRATION_ENABLED="%(ENV_REGISTRATION_ENABLED)s"
